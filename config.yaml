# Jarvis Configuration
# Phase 1 - Personal Assistant

app:
  name: "Jarvis"
  version: "0.1.0"
  debug: false

server:
  host: "127.0.0.1"
  port: 8000
  reload: true

# API keys (set via environment variables or .env file)
# OPENWEATHER_API_KEY=your_key
# NEWS_API_KEY=your_key

plugins:
  enabled:
    - weather
    - news
    - notes
    - tasks

morning_report:
  enabled: true
  # Time in 24h format
  time: "07:00"
  sections:
    - weather
    - calendar
    - tasks
    - news

logging:
  level: "INFO"
  file: "jarvis.log"
